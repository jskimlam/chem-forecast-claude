# 시트의 가격을 받아 대시보드를 만들어 GitHub Pages 로 배포합니다.
# 실행 시점: 평일 아침 한국시간 08:00(UTC 일~목 23:00), 수동 실행, 코드가 main 에 올라올 때, 그리고 admin.html 저장 직후(Apps Script 가 호출).
name: build-site

on:
  push:
    branches: [main]
    paths: ["src/**", "templates/**", "tests/**", "requirements.txt", ".github/workflows/build.yml"]
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt pytest

      - name: 코드 테스트
        run: python -m pytest tests -q

      - name: 시트에서 가격 받기
        env:
          CHEM_GAS_URL: ${{ secrets.CHEM_GAS_URL }}
          CHEM_GAS_TOKEN: ${{ secrets.CHEM_GAS_TOKEN }}
        run: python -m src.cli sync --no-build

      - name: 시트 가격 현황 기록(실행 화면 주석으로 표시)
        run: |
          python -m src.cli check > check.txt || true
          echo "::notice title=시트에서 받은 가격 현황::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' check.txt)"
          rm -f check.txt

      - name: 대시보드 만들기
        env:
          CHEM_GAS_URL: ${{ secrets.CHEM_GAS_URL }}
        run: |
          set -o pipefail  # 빌드가 실패하면 tee 를 거쳐도 실패로 처리
          python -m src.cli build | tee build.log
          echo "::notice title=품목별 데이터 품질 경고::$(grep '^\[품질\]' build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' || true)"
          rm -f site/artifact.html build.log

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
