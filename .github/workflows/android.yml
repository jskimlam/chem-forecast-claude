# APK 만들기: 안드로이드 껍데기 앱(android/ 폴더)을 빌드해서 릴리스에 올립니다.
# 실행: Actions > build-apk > Run workflow (android/ 폴더가 바뀌어 푸시되면 자동 실행)
name: build-apk

on:
  workflow_dispatch: {}      # 수동 실행
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write            # 릴리스 파일 올리기 권한

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # 코드 내려받기
      - uses: actions/setup-java@v4               # 자바 17 설치
        with:
          distribution: temurin
          java-version: "17"
      - name: 안드로이드 SDK 준비(러너에 설치돼 있는 SDK 사용, 라이선스 동의와 빌드 도구 확인)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4      # 그래들 설치
        with:
          gradle-version: "8.7"
      - name: 디버그 APK 빌드
        run: gradle -p android assembleDebug --no-daemon
      - name: APK 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChemForecast.apk
      - uses: actions/upload-artifact@v4          # 빌드 결과 보관(백업용)
        with:
          name: ChemForecast-apk
          path: ChemForecast.apk
      - name: 릴리스에 올리기(폰에서 바로 내려받기용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ChemForecast.apk --title "원료 가격 분석 APK" --notes "대시보드를 앱으로 여는 껍데기 앱입니다. 설치 후 대시보드는 항상 최신 사이트를 불러옵니다."
